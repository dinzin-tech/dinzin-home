<script>
    function toggleHeaderInput() {
        var headerFormat = document.getElementById("header_format").value;
        var headerTextInput = document.getElementById("header_text_input");
        var headerMediaInput = document.getElementById("header_media_input");
        if (headerFormat === "TEXT") {
            headerTextInput.style.display = "block";
            headerMediaInput.style.display = "none";
        } else if (headerFormat === "MEDIA") {
            headerTextInput.style.display = "none";
            headerMediaInput.style.display = "block";
        }
    }
    function toggleMediaTypeInput() {
        var mediaType = document.querySelector('input[name="media_type"]:checked').value;
        var imageInput = document.getElementById("image_input");
        var videoInput = document.getElementById("video_input");
        var locationInput = document.getElementById("location_input");
        var documentInput=document.getElementById("document_input")

        if (mediaType === "image") {
            imageInput.style.display = "block";
            videoInput.style.display = "none";
            locationInput.style.display = "none";
            documentInput.style.display="none";
        } else if (mediaType === "video") {
            imageInput.style.display = "none";
            videoInput.style.display = "block";
            locationInput.style.display = "none";
            documentInput.style.display="none";
        } else if (mediaType === "location") {
            imageInput.style.display = "none";
            videoInput.style.display = "none";
            locationInput.style.display = "block";
            documentInput.style.display="none";
        }
        else if (mediaType === "document") {
            imageInput.style.display = "none";
            videoInput.style.display = "none";
            locationInput.style.display = "none";
            documentInput.style.display="block";
        }
    }
    var mediaTypeRadios = document.querySelectorAll('input[name="media_type"]');
    mediaTypeRadios.forEach(function(radio) {
        radio.addEventListener('change', toggleMediaTypeInput);
    });
</script>
