<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizzes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .container {
            width: 80%;
            margin: 0 auto;
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        .action-buttons button {
            margin-right: 5px;
            padding: 5px 10px;
            border: none;
            cursor: pointer;
        }
        .edit-btn { background-color: #4CAF50; color: white; }
        .manage-btn { background-color: #007BFF; color: white; }
        .delete-btn { background-color: #F44336; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>Quizzes</h2>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Duration</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="quizTableBody">
            <!-- Quizzes will be populated here by jQuery -->
        </tbody>
    </table>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$(document).ready(function() {
    // Fetch quizzes and populate the table
    $.ajax({
        url: 'fetch_quizzes.php',
        method: 'GET',
        dataType: 'json',
        success: function(data) {
            var quizTableBody = $('#quizTableBody');
            $.each(data, function(index, quiz) {
                quizTableBody.append(`
                    <tr>
                        <td>${quiz.name}</td>
                        <td>${quiz.description}</td>
                        <td>${quiz.duration}</td>
                        <td class="action-buttons">
                            <button class="edit-btn" onclick="editQuiz(${quiz.id})">Edit</button>
                            <button class="manage-btn" onclick="manageQuiz(${quiz.id})">Manage</button>
                            <button class="delete-btn" onclick="deleteQuiz(${quiz.id})">Delete</button>
                        </td>
                    </tr>
                `);
            });
        },
        error: function(error) {
            console.error('Error fetching quizzes:', error);
        }
    });
});

function editQuiz(id) {
    // Redirect to the edit quiz page
    window.location.href = 'edit_quiz.php?id=' + id;
}

function manageQuiz(id) {
    // Redirect to the manage quiz page
    window.location.href = 'manage_quiz.php?id=' + id;
}

function deleteQuiz(id) {
    // Delete quiz using AJAX
    if (confirm('Are you sure you want to delete this quiz?')) {
        $.ajax({
            url: 'delete_quiz.php',
            method: 'POST',
            data: { id: id },
            success: function(response) {
                alert('Quiz deleted successfully');
                location.reload();
            },
            error: function(error) {
                console.error('Error deleting quiz:', error);
            }
        });
    }
}
</script>

</body>
</html>
